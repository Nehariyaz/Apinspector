image: node:20

services:
  - name: postgres:latest
    alias: postgres
    command: ["postgres", "-c", "log_statement=all"]

variables:
  POSTGRES_DB: testdb
  POSTGRES_USER: testuser
  POSTGRES_PASSWORD: testpassword
  DB_HOST: postgres  # Matches the alias
  DB_NAME: testdb
  DB_USER: testuser
  DB_PASS: testpassword  
  DB_PORT: 5432
  FRONTEND_URL: http://localhost:3000

stages:
  - install
  - test
  - deploy

install_dependencies_backend:
  stage: install
  script:
    - cd backend && npm ci  # Faster and ensures package-lock.json consistency
  only:
    - main

install_dependencies_frontend:
  stage: install
  script:
    - cd frontend && npm ci
  only:
    - main

run_tests_backend:
  stage: test
  before_script:
    - apt-get update && apt-get install -y postgresql-client netcat-traditional
    - echo "Waiting for PostgreSQL..."
    - |
      until pg_isready -h "$DB_HOST" -p "$DB_PORT"; do
        echo "PostgreSQL is unavailable - sleeping"
        sleep 1
      done
    - echo "PostgreSQL is ready!"
    - cd backend
    - cp .env.example .env  # Ensure the .env file exists (modify as needed)
    - npx sequelize-cli db:migrate || echo "No migrations found, skipping..."  # Run DB migrations if applicable
  script:
    - npx jest --runInBand --forceExit --detectOpenHandles  
  only:
    - main

run_tests_frontend:
  stage: test
  script:
    - cd frontend
    - if npm run | grep -q test; then npm test; else echo "No test script found, skipping..."; fi  
  only:
    - main
