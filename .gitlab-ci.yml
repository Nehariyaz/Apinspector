image: node:20

services:
  - name: postgres:latest
    alias: postgres

variables:
  POSTGRES_DB: testdb
  POSTGRES_USER: testuser
  POSTGRES_PASSWORD: testpassword
  DB_HOST: postgres
  DB_NAME: testdb
  DB_USER: testuser
  DB_PASS: testpassword
  DB_PORT: 5432
  NODE_ENV: test

stages:
  - install
  - test
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/node_modules/
    - frontend/node_modules/

before_script:
  - apt-get update && apt-get install -y postgresql-client netcat-traditional
  - echo "Waiting for PostgreSQL..."
  - |
    until pg_isready -h $DB_HOST -p $DB_PORT -U $POSTGRES_USER; do
      sleep 2
      echo "Waiting for PostgreSQL..."
    done
  - echo "PostgreSQL is ready!"

install_dependencies_backend:
  stage: install
  script:
    - cd backend
    - npm ci --prefer-offline
  artifacts:
    paths:
      - backend/node_modules/
  only:
    - main

install_dependencies_frontend:
  stage: install
  script:
    - cd frontend
    - npm ci --prefer-offline
  artifacts:
    paths:
      - frontend/node_modules/
  only:
    - main

run_tests_backend:
  stage: test
  script:
    - cd backend
    - npm install -g sequelize-cli
    - npx sequelize-cli db:migrate
    - npx jest --runInBand --detectOpenHandles --coverage
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
    paths:
      - backend/coverage/
  dependencies:
    - install_dependencies_backend
  only:
    - main

run_tests_frontend:
  stage: test
  script:
    - cd frontend
    - npm test || echo "Frontend tests not configured, skipping..."
  dependencies:
    - install_dependencies_frontend
  only:
    - main

deploy:
  stage: deploy
  script:
    - echo "Deploying application..."
  only:
    - main