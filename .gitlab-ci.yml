image: node:20

services:
  - name: postgres:latest
    alias: postgres
    variables:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      ports:
      - "5432:5432"

variables:
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: testdb
  DB_USER: testuser
  DB_PASSWORD: testpassword
  NODE_ENV: test

stages:
  - install
  - test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/node_modules/

before_script:
  - apt-get update && apt-get install -y postgresql-client netcat-traditional
  - echo "Waiting for PostgreSQL to be ready..."
  - |
    for i in {1..15}; do
      if pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME; then
        echo "PostgreSQL is ready!"
        break
      fi
      echo "Attempt $i/15 - PostgreSQL not ready yet..."
      sleep 2
    done
  # Verify credentials work
  - PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -c "CREATE TABLE IF NOT EXISTS ci_test (id SERIAL); DROP TABLE IF EXISTS ci_test;"
  - echo "Database connection verified!"

install_dependencies_backend:
  stage: install
  script:
    - cd backend
    - npm ci --prefer-offline
  artifacts:
    paths:
      - backend/node_modules/
  only:
    - main

run_tests_backend:
  stage: test
  script:
    - cd backend
    - npm install -g sequelize-cli
    - echo "Running migrations..."
    - npx sequelize-cli db:migrate
    - echo "Running tests..."
    - npm test -- --runInBand --detectOpenHandles --coverage
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
    paths:
      - backend/coverage/
  dependencies:
    - install_dependencies_backend
  only:
    - main