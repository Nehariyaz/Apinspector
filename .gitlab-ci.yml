stages:
  - build
  - test
  - deploy

job_build:
  stage: build
  script:
    - echo "Building the application..."
    - mvn clean package  # Example for Java projects

job_test:
  stage: test
  script:
    - echo "Running tests..."
    - mvn test

job_deploy:
  stage: deploy
  script:
    - echo "Deploying application..."
    - ./deploy.sh  # Example deployment script
  only:
    - main  # Deploy only on main branch
