image: node:20

services:
  - name: postgres:latest
    alias: postgres
    command: ["postgres", "-c", "log_statement=all"]

variables:
  POSTGRES_DB: testdb
  POSTGRES_USER: testuser
  POSTGRES_PASSWORD: testpassword
  DB_HOST: postgres  # Matches the alias
  DB_NAME: testdb
  DB_USER: testuser
  DB_PASS: testpassword
  DB_PORT: 5432

stages:
  - install
  - test
  - deploy

install_dependencies_backend:
  stage: install
  script:
    - cd backend
    - npm install
  only:
    - main

install_dependencies_frontend:
  stage: install
  script:
    - cd frontend 
    - npm install
  only:
    - main

run_tests_backend:
  stage: test
  before_script:
    - apt-get update && apt-get install -y postgresql-client netcat-traditional
    - echo "Waiting for PostgreSQL..."
    - |
      until nc -z $DB_HOST $DB_PORT; do
        echo "PostgreSQL is unavailable - sleeping"
        sleep 1
      done
    - echo "✅ PostgreSQL is ready!"

  script:
    - cd backend
    - npm install
    - npx jest --detectOpenHandles --forceExit   
  only:
    - main

run_tests_frontend:
  stage: test
  script:
    - cd frontend
    - npm install 
    - npm test || echo "No tests available, skipping..."  # Prevents failure if no test script
  only:
    - main
