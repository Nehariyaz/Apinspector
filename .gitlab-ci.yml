image: node:20

services:
  - name: postgres:latest
    alias: postgres

variables:
  POSTGRES_DB: testdb
  POSTGRES_USER: testuser
  POSTGRES_PASSWORD: testpassword
  DB_HOST: postgres
  DB_NAME: testdb
  DB_USER: testuser
  DB_PASS: testpassword
  DB_PORT: 5432
  NODE_ENV: test

stages:
  - install
  - test
  - deploy

install_dependencies_backend:
  stage: install
  script:
    - cd backend
    - npm install
  only:
    - main

install_dependencies_frontend:
  stage: install
  script:
    - cd frontend
    - npm install
  only:
    - main

run_tests_backend:
  stage: test
  before_script:
    - apt-get update && apt-get install -y postgresql-client netcat-traditional
    - echo "Waiting for PostgreSQL..."
    - |
      until pg_isready -h $DB_HOST -p $DB_PORT -U $POSTGRES_USER; do
        echo "PostgreSQL is unavailable - sleeping"
        sleep 2
      done
    - echo "PostgreSQL is ready!"
    - cd backend
    - npm install
    - npx sequelize-cli db:migrate  
  script:
    - npx jest --runInBand --detectOpenHandles
  only:
    - main

run_tests_frontend:
  stage: test
  script:
    - cd frontend
    - npm install
    - npm test || echo "No tests available, skipping..."  
  only:
    - main

deploy:
  stage: deploy
  script:
    - echo "Deploying application..."
  only:
    - main
